{% if breadcrumbs %}
    <section class="breadcrumbs-band" aria-label="Breadcrumb">
        <div class="container">
            <ol class="breadcrumbs">
                {% for crumb in breadcrumbs %}
                    <li>
                        {% if crumb.url and not forloop.last %}
                            <a href="{{ crumb.url }}">{{ crumb.label }}</a>
                        {% else %}
                            <span {% if forloop.last %}aria-current="page"{% endif %}>{{ crumb.label }}</span>
                        {% endif %}
                    </li>
                {% endfor %}
            </ol>
        </div>
    </section>
{% endif %}
